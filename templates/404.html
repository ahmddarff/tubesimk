{% extends 'layout.html' %}

{% block title %}Halaman Tidak Ditemukan - Terralog{% endblock %}

{% block content %}
<div class="min-h-screen bg-[#F5F7FF] flex items-center justify-center p-6 md:p-12 font-['Inter']">
    <div class="max-w-5xl w-full grid grid-cols-1 md:grid-cols-2 gap-12 items-center bg-white rounded-[32px] shadow-sm border border-slate-100 p-8 md:p-16">
        
        <div class="text-center md:text-left order-2 md:order-1">
            <h1 class="text-6xl md:text-8xl font-black text-terralogBlue mb-4">404</h1>
            <h2 class="text-2xl md:text-3xl font-bold text-slate-800 mb-3">Halaman Tidak Ditemukan</h2>
            <p class="text-sm md:text-base font-medium text-slate-500 mb-8 leading-relaxed">
                Maaf, halaman atau data pesanan yang Anda cari tidak tersedia, telah dihapus, atau Anda tidak memiliki akses untuk melihatnya.
            </p>

            <div class="flex flex-col sm:flex-row gap-4 justify-center md:justify-start">
                <button onclick="window.history.back()" class="px-6 py-4 bg-terralogBlue hover:bg-blue-900 text-white rounded-xl text-sm font-bold tracking-wide transition-colors shadow-md flex items-center justify-center gap-2 cursor-pointer">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i> Kembali ke Halaman Sebelumnya
                </button>
            </div>
        </div>

        <div class="flex items-center justify-center order-1 md:order-2">
            <img src="{{ url_for('static', filename='images/gambar.png') }}" alt="Halaman Tidak Ditemukan" class="w-full max-w-xs md:max-w-md h-auto object-contain">
        </div>
        
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }
    });
</script>
{% endblock %}
