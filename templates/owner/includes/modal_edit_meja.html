<div x-show="showModalEdit" class="fixed inset-0 z-[100] flex items-center justify-center p-4" style="display: none;">
    <div x-transition.opacity class="absolute inset-0 bg-black/50 backdrop-blur-sm" @click="showModalEdit = false"></div>
    <div x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100" 
         class="w-full max-w-sm bg-white rounded-3xl shadow-2xl relative z-10 overflow-hidden flex flex-col">
        
        <div class="px-6 py-5 bg-terralogBlue flex justify-between items-center shrink-0">
            <h2 class="text-xl font-bold text-white tracking-tight">Edit Meja</h2>
            <button @click="showModalEdit = false" class="text-white/60 hover:text-white transition-colors cursor-pointer">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
        </div>

        <div class="p-6 space-y-4">
            <div>
                <label class="block mb-2 text-xs font-bold text-gray-500 uppercase">Nomor Meja</label>
                <input type="text" x-model="formEdit.nomor" class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:border-terralogBlue outline-none text-sm font-bold uppercase">
            </div>
            <div>
                <label class="block mb-2 text-xs font-bold text-gray-500 uppercase">Kapasitas (Orang)</label>
                <input type="number" x-model="formEdit.kapasitas" min="1"class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:border-terralogBlue outline-none text-sm font-bold">
            </div>
        </div>

        <div class="px-6 py-5 border-t border-gray-50 bg-gray-50/50 flex justify-end gap-3">
            <button @click="showModalEdit = false" class="px-6 py-3 border border-gray-200 rounded-xl text-sm font-bold text-gray-500 hover:bg-gray-100 transition shadow-sm cursor-pointer">Batal</button>
            <button @click="updateMeja()" class="px-8 py-3 bg-terralogBlue text-white rounded-xl text-sm font-bold shadow-md hover:bg-blue-900 transition active:scale-95 cursor-pointer">Simpan</button>
        </div>
    </div>
</div>
