<div x-show="showModalUlasan" class="fixed inset-0 z-[100] flex items-center justify-center p-4" style="display: none;">
    <div x-transition.opacity class="absolute inset-0 bg-black/60 backdrop-blur-sm" @click="showModalUlasan = false"></div>
    <div x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100" 
        class="w-full max-w-lg bg-[#F5F7FF] rounded-3xl shadow-2xl relative z-10 overflow-hidden flex flex-col max-h-[85vh]">
        
        <div class="px-6 py-5 bg-terralogBlue flex justify-between items-center shrink-0">
            <div>
                <h2 class="text-xl font-bold text-white tracking-tight">Ulasan Pelanggan</h2>
                <p class="text-white/70 font-medium text-xs mt-0.5" x-text="ulasanMenuTitle"></p>
            </div>
            <button @click="showModalUlasan = false" class="text-white/60 hover:text-white transition-colors cursor-pointer">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
        </div>

        <div class="p-6 overflow-y-auto custom-scrollbar flex-1 space-y-4">
            
            <div x-show="isLoadingUlasan" class="space-y-4 animate-pulse">
                <template x-for="i in 3">
                    <div class="bg-white p-5 rounded-2xl border border-gray-100">
                        <div class="h-4 bg-gray-200 rounded w-1/3 mb-4"></div>
                        <div class="h-3 bg-gray-200 rounded w-full mb-2"></div>
                        <div class="h-3 bg-gray-200 rounded w-4/5"></div>
                    </div>
                </template>
            </div>

            <template x-show="!isLoadingUlasan" x-for="(ulasan, index) in ulasanList" :key="index">
                <div class="bg-white p-5 rounded-2xl border border-gray-100 shadow-sm relative group hover:border-terralogBlue/30 transition-colors">
                    <div class="flex justify-between items-start mb-3">
                        <div class="flex items-center gap-2">
                            <div class="w-8 h-8 rounded-full bg-blue-50 text-terralogBlue flex items-center justify-center font-black text-xs uppercase"
                                x-text="ulasan.customer.charAt(0)"></div>
                            <div>
                                <h4 class="text-sm font-bold text-gray-800" x-text="ulasan.customer"></h4>
                                <p class="text-[10px] font-medium text-gray-400" x-text="ulasan.date"></p>
                            </div>
                        </div>
                        <div class="flex items-center gap-0.5 bg-amber-50 px-2 py-1 rounded-md">
                            <i data-lucide="star" class="w-3 h-3 fill-amber-400 text-amber-400"></i>
                            <span class="text-xs font-black text-amber-600" x-text="ulasan.rating + '.0'"></span>
                        </div>
                    </div>
                    <p class="text-sm text-gray-600 font-medium leading-relaxed" 
                        :class="ulasan.comment === 'Tidak ada komentar tulisan.' ? 'italic opacity-60' : ''"
                        x-text="ulasan.comment"></p>
                </div>
            </template>

            <div x-show="!isLoadingUlasan && ulasanList.length === 0" class="text-center py-8">
                <i data-lucide="message-square-dashed" class="w-12 h-12 mx-auto text-gray-300 mb-3"></i>
                <p class="text-sm font-bold text-gray-400">Belum ada data ulasan.</p>
            </div>
        </div>
    </div>
</div>
