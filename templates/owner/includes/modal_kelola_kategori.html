<div x-show="showModalKategori" class="fixed inset-0 z-[100] flex items-center justify-center p-4" style="display: none;">
    <div x-transition.opacity class="absolute inset-0 bg-black/50 backdrop-blur-sm" @click="showModalKategori = false"></div>
    <div x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100" 
         class="w-full max-w-lg bg-white rounded-3xl shadow-2xl relative z-10 overflow-hidden flex flex-col">
        
        <div class="px-6 py-5 bg-terralogBlue flex justify-between items-center shrink-0">
            <h2 class="text-xl font-bold text-white tracking-tight">Kelola Kategori</h2>
            <button @click="showModalKategori = false" class="text-white/60 hover:text-white transition-colors cursor-pointer">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
        </div>

        <div class="p-6">
            <div class="flex gap-2 mb-6">
                <input type="text" x-model="inputKategoriBaru" @keydown.enter="tambahKategori()" class="flex-1 px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 outline-none text-sm font-bold text-gray-700 focus:bg-white focus:border-terralogBlue transition-colors" placeholder="Ketik nama kategori baru...">
                
                <select x-model="inputTypeKategoriBaru" class="w-1/3 px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 outline-none text-sm font-bold text-gray-700 focus:bg-white focus:border-terralogBlue transition-colors">
                    <option value="food">Dapur (Food)</option>
                    <option value="beverage">Barista (Beverage)</option>
                </select>

                <button @click="tambahKategori()" class="px-5 py-3 bg-terralogBlue text-white rounded-xl font-bold text-sm hover:bg-blue-900 transition-all shadow-md active:scale-95 flex items-center justify-center cursor-pointer">
                    <i data-lucide="plus" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="space-y-2 max-h-[50vh] overflow-y-auto pr-2">
                <template x-for="kat in categories" :key="kat.id">
                    <div class="flex items-center justify-between p-3 rounded-xl border border-gray-100 hover:bg-gray-50 transition group">
                        
                        <div x-show="editingCategoryId !== kat.id" class="flex justify-between items-center w-full">
                            <div class="flex items-center gap-3">
                                
                                <p class="font-bold text-gray-700 text-sm" x-text="kat.nama"></p>
                                
                                <span class="px-2 py-0.5 rounded-md text-[10px] font-black uppercase tracking-wider"
                                      :class="kat.tipe === 'beverage' ? 'bg-blue-100 text-terralogBlue' : 'bg-orange-100 text-orange-600'"
                                      x-text="kat.tipe === 'beverage' ? 'Minuman' : 'Makanan'"></span>
                            </div>
                            
                            <div class="flex items-center gap-1">
                                <button @click="mulaiEditKategori(kat)" class="p-2 text-terralogBlue hover:bg-blue-50 rounded-lg transition cursor-pointer" title="Edit">
                                    <i data-lucide="edit-2" class="w-4 h-4"></i>
                                </button>
                                <button @click="hapusKategori(kat.id)" class="p-2 text-red-500 hover:bg-red-50 rounded-lg transition cursor-pointer" title="Hapus">
                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>
                        
                        <div x-show="editingCategoryId === kat.id" class="flex items-center gap-2 w-full" style="display: none;">
                            <input type="text" x-model="editCategoryName" @keydown.enter="simpanEditKategori(kat.id)" class="flex-1 px-3 py-2 rounded-lg border-2 border-blue-200 bg-blue-50 outline-none text-sm font-bold text-terralogBlue">
                            
                            <select x-model="editCategoryType" class="px-3 py-2 rounded-lg border-2 border-blue-200 bg-blue-50 outline-none text-sm font-bold text-terralogBlue">
                                <option value="food">Makanan</option>
                                <option value="beverage">Beverage</option>
                            </select>

                            <button @click="simpanEditKategori(kat.id)" class="p-2 bg-emerald-500 text-white rounded-lg hover:bg-emerald-600 transition shadow-md cursor-pointer">
                                <i data-lucide="check" class="w-4 h-4"></i>
                            </button>
                            <button @click="editingCategoryId = null" class="p-2 bg-gray-200 text-gray-600 rounded-lg hover:bg-gray-300 transition cursor-pointer">
                                <i data-lucide="x" class="w-4 h-4"></i>
                            </button>
                        </div>

                    </div>
                </template>
            </div>
        </div>
    </div>
</div>
