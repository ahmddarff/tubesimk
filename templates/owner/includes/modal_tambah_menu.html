<div x-show="showModalTambah" class="fixed inset-0 z-[100] flex items-center justify-center p-4" style="display: none;">
    <div x-transition.opacity class="absolute inset-0 bg-black/50 backdrop-blur-sm" @click="showModalTambah = false"></div>
    <div x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100" 
         class="w-full max-w-lg bg-white rounded-3xl shadow-2xl relative z-10 overflow-hidden flex flex-col max-h-[90vh]">
        
        <div class="px-6 py-5 bg-terralogBlue flex justify-between items-center shrink-0">
            <h2 class="text-xl font-bold text-white tracking-tight">Tambah Menu Baru</h2>
            <button @click="showModalTambah = false" class="text-white/60 hover:text-white transition-colors cursor-pointer">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
        </div>

        <div class="px-6 py-5 space-y-4 overflow-y-auto custom-scrollbar bg-white">
            <div>
                <label class="block mb-2 text-xs font-bold text-gray-500 uppercase">Foto Produk</label>
                <div class="relative w-full p-6 border-2 border-dashed border-gray-300 rounded-2xl bg-gray-50 flex flex-col items-center justify-center cursor-pointer hover:bg-gray-100 hover:border-terralogBlue transition-colors group"
                     @dragover.prevent="$el.classList.add('border-terralogBlue', 'bg-blue-50')"
                     @dragleave.prevent="$el.classList.remove('border-terralogBlue', 'bg-blue-50')"
                     @drop.prevent="$el.classList.remove('border-terralogBlue', 'bg-blue-50'); handleDrop($event, 'tambah')"
                     @click="$refs.fotoTambah.click()">
                    
                    <input type="file" x-ref="fotoTambah" accept="image/*" class="hidden" @change="previewImage($event, 'tambah')">
                    
                    <template x-if="formMenu.imgPreview">
                        <div class="w-24 h-24 rounded-2xl overflow-hidden shadow-sm mb-3 border-2 border-white">
                            <img :src="formMenu.imgPreview" class="w-full h-full object-cover">
                        </div>
                    </template>
                    <template x-if="!formMenu.imgPreview">
                        <div class="w-14 h-14 bg-white rounded-full flex items-center justify-center shadow-sm mb-3 group-hover:scale-110 transition-transform">
                            <i data-lucide="upload-cloud" class="w-7 h-7 text-terralogBlue"></i>
                        </div>
                    </template>
                    
                    <p class="text-sm font-bold text-gray-700" x-text="formMenu.imgPreview ? 'Klik untuk ganti gambar' : 'Klik atau Drag & Drop foto di sini'"></p>
                    <p class="text-[10px] font-medium text-gray-400 mt-1 uppercase tracking-widest">Maksimal 2MB (JPG, PNG)</p>
                </div>
            </div>

            <div>
                <label class="block mb-2 text-xs font-bold text-gray-500 uppercase">Nama Menu</label>
                <input type="text" x-model="formMenu.nama" class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:border-terralogBlue outline-none text-sm font-bold" placeholder="Contoh: Nasi Goreng Spesial">
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block mb-2 text-xs font-bold text-gray-500 uppercase">Kategori</label>
                    <select x-model="formMenu.kategori" class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:border-terralogBlue outline-none text-sm font-bold appearance-none cursor-pointer">
                        <option value="" disabled>Pilih Kategori</option>
                        <template x-for="kat in categories" :key="kat.id">
                            <option :value="kat.nama" x-text="kat.nama"></option>
                        </template>
                    </select>
                </div>
                <div>
                    <label class="block mb-2 text-xs font-bold text-gray-500 uppercase">Harga Jual (Rp)</label>
                    <input type="number" x-model="formMenu.harga" class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:border-terralogBlue outline-none text-sm font-bold" placeholder="Contoh: 25000">
                </div>
            </div>

            <div class="p-4 rounded-xl border border-gray-100 bg-gray-50/50">
                <label class="flex items-center gap-2 cursor-pointer w-fit" :class="formMenu.hasStock ? 'mb-3' : ''">
                    <input type="checkbox" x-model="formMenu.hasStock" class="w-4 h-4 rounded border-gray-300 text-terralogBlue">
                    <span class="text-xs font-bold text-gray-600 uppercase">Gunakan Manajemen Stok</span>
                </label>
                <div x-show="formMenu.hasStock" x-transition>
                    <input type="number" x-model="formMenu.stok" placeholder="Contoh: 50" class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-white focus:border-terralogBlue outline-none text-sm font-bold">
                </div>
            </div>

            <div>
                <label class="block mb-2 text-xs font-bold text-gray-500 uppercase">Deskripsi (Opsional)</label>
                <textarea x-model="formMenu.deskripsi" rows="2" class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:border-terralogBlue outline-none text-sm font-bold resize-none" placeholder="Jelaskan detail rasa atau isi menu..."></textarea>
            </div>
        </div>

        <div class="px-6 py-4 border-t border-gray-100 bg-gray-50/50 flex justify-end gap-3 shrink-0">
            <button @click="showModalTambah = false" class="px-6 py-2.5 border border-gray-200 rounded-xl text-sm font-bold text-gray-500 hover:bg-gray-100 transition shadow-sm cursor-pointer">Batal</button>
            <button @click="simpanMenu()" class="px-8 py-2.5 bg-terralogBlue text-white rounded-xl text-sm font-bold shadow-md hover:bg-blue-900 transition active:scale-95 cursor-pointer">Simpan Menu</button>
        </div>
    </div>
</div>
