<div x-show="showModalEdit" 
     x-cloak
     class="fixed inset-0 z-[100] flex items-center justify-center p-4" 
     style="display: none;">
    
    <div x-transition.opacity 
         class="absolute inset-0 bg-black/50 backdrop-blur-sm" 
         @click="showModalEdit = false"></div>
         
    <div x-transition:enter="transition ease-out duration-300" 
         x-transition:enter-start="opacity-0 scale-95" 
         x-transition:enter-end="opacity-100 scale-100" 
         class="w-full max-w-md bg-white rounded-3xl shadow-2xl relative z-10 overflow-hidden flex flex-col">
        
        <div class="px-6 py-5 bg-terralogBlue flex justify-between items-center shrink-0">
            <h2 class="text-xl font-bold text-white tracking-tight" x-text="'Edit Profil: ' + formEdit.nama">Edit Profil Staff</h2>
            <button @click="showModalEdit = false" class="text-white/60 hover:text-white transition-colors cursor-pointer">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
        </div>

        <div class="p-6 space-y-4">
            <div>
                <label class="block mb-2 text-xs font-bold text-gray-500 uppercase">Nama Lengkap</label>
                <input type="text" x-model="formEdit.nama" class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:border-terralogBlue outline-none text-sm font-bold transition-all" placeholder="Masukkan nama lengkap">
            </div>

            <div>
                <label class="block mb-2 text-xs font-bold text-gray-500 uppercase">Jabatan</label>
                <select x-model="formEdit.jabatan" class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:border-terralogBlue outline-none text-sm font-bold transition-all cursor-pointer">
                    <option value="kasir">Kasir</option>
                    <option value="koki">Koki</option>
                </select>
            </div>

            <div>
                <label class="block mb-2 text-xs font-bold text-gray-500 uppercase">Reset Password Baru (Opsional)</label>
                <input type="text" x-model="formEdit.password" placeholder="Kosongkan jika tidak ingin diubah" class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:border-terralogBlue outline-none text-sm font-bold transition-all">
            </div>

            <div class="flex items-center justify-between p-4 border border-gray-100 bg-gray-50/50 rounded-xl mt-2">
                <span class="text-xs font-bold text-gray-500 uppercase">Status Aktif</span>
                <label class="toggle-switch relative inline-block w-[46px] h-6 cursor-pointer">
                    <input type="checkbox" x-model="formEdit.isActive">
                    <span class="toggle-slider"></span>
                </label>
            </div>
        </div>

        <div class="px-6 py-5 border-t border-gray-50 bg-gray-50/50 flex justify-end gap-3 shrink-0">
            <button @click="showModalEdit = false" class="px-6 py-3 border border-gray-200 rounded-xl text-sm font-bold text-gray-500 hover:bg-gray-100 transition shadow-sm cursor-pointer">Batal</button>
            <button @click="updateStaff()" class="px-8 py-3 bg-terralogBlue text-white rounded-xl text-sm font-bold shadow-md hover:bg-blue-900 transition active:scale-95 cursor-pointer">Simpan</button>
        </div>
    </div>
</div>
