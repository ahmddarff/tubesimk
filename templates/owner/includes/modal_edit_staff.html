<div x-show="showModalEdit" 
     x-cloak
     class="fixed inset-0 bg-black/45 backdrop-blur-sm z-[1000] flex items-center justify-center"
     style="display: none;">
    
    <div class="bg-white rounded-2xl w-full max-w-md mx-4 shadow-2xl" @click.away="showModalEdit = false">
        <div class="flex items-center justify-between px-6 py-5 border-b border-gray-100">
            <h2 class="text-lg font-bold text-gray-900" x-text="'Edit Profil: ' + formEdit.nama">Edit Profil Staff</h2>
            <button @click="showModalEdit = false" class="text-gray-400 hover:text-red-500 transition-colors">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>

        <div class="p-6 space-y-4">
            <div class="space-y-1">
                <label class="text-xs font-bold text-gray-400 uppercase">Nama Lengkap</label>
                <input type="text" x-model="formEdit.nama" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:border-terralogBlue outline-none text-sm font-medium transition-all">
            </div>

            <div class="space-y-1">
                <label class="text-xs font-bold text-gray-400 uppercase">Jabatan</label>
                <select x-model="formEdit.jabatan" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:border-terralogBlue outline-none text-sm font-medium transition-all">
                    <option value="kasir">Kasir</option>
                    <option value="koki">Koki</option>
                </select>
            </div>

            <div class="flex items-center justify-between p-3 bg-gray-50 rounded-xl">
                <span class="text-sm font-bold text-gray-600">Status Aktif</span>
                <label class="toggle-switch relative inline-block w-[46px] h-6 cursor-pointer">
                    <input type="checkbox" x-model="formEdit.isActive">
                    <span class="toggle-slider"></span>
                </label>
            </div>
        </div>

        <div class="p-6 border-t border-gray-100 flex gap-3">
            <button @click="updateStaff()" class="flex-1 py-3 bg-terralogBlue text-white rounded-xl font-bold text-sm hover:bg-blue-900 transition-all">Simpan Perubahan</button>
            <button @click="showModalEdit = false" class="px-6 py-3 bg-gray-100 text-gray-500 rounded-xl font-bold text-sm hover:bg-gray-200 transition-all">Batal</button>
        </div>
    </div>
</div>
