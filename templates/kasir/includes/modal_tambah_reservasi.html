<div x-show="showAddModal" class="fixed inset-0 z-[150] flex items-center justify-center" style="display: none;" x-cloak>
    <div x-transition:opacity class="absolute inset-0 bg-black/50 backdrop-blur-sm" @click="showAddModal = false"></div>
    <div x-transition:enter="transition ease-out duration-300 transform scale-95 opacity-0" x-transition:enter-end="scale-100 opacity-100" 
         class="relative bg-white w-full max-w-[550px] mx-4 rounded-3xl shadow-2xl overflow-hidden">
        
        <div class="px-6 py-5 bg-terralogBlue flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-white/20 p-2 rounded-lg">
                    <i data-lucide="calendar-plus" class="w-5 h-5 text-white"></i>
                </div>
                <h2 class="text-xl font-bold text-white tracking-tight">Tambah Reservasi Baru</h2>
            </div>
            <button @click="showAddModal = false" class="text-white/60 hover:text-white transition-colors">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
        </div>

        <div class="p-6 space-y-4 bg-white text-left">
            
            <div class="flex gap-4">
                <div class="flex-[1.5]">
                    <label class="text-[10px] font-bold text-gray-400 uppercase mb-1.5 block tracking-wide">Nama Pelanggan</label>
                    <input type="text" x-model="newRes.nama" placeholder="Masukkan nama..." class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm outline-none focus:bg-white focus:border-terralogBlue transition-all">
                </div>
                <div class="flex-1">
                    <label class="text-[10px] font-bold text-gray-400 uppercase mb-1.5 block tracking-wide">Nomor Telepon</label>
                    <input type="text" x-model="newRes.telepon" @input="newRes.telepon = newRes.telepon.replace(/[^0-9]/g, '');" placeholder="08..." class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm outline-none focus:bg-white focus:border-terralogBlue transition-all">
                </div>
            </div>

            <div class="flex gap-4">
                <div class="flex-[1.5]">
                    <label class="text-[10px] font-bold text-gray-400 uppercase mb-1.5 block tracking-wide">Tanggal Kedatangan</label>
                    <input type="date" x-model="newRes.tanggal" :min="today" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm outline-none focus:bg-white focus:border-terralogBlue transition-all cursor-pointer">
                </div>
                <div class="flex-1">
                    <label class="text-[10px] font-bold text-gray-400 uppercase mb-1.5 block tracking-wide">Jumlah Tamu</label>
                    <div class="relative">
                        <i data-lucide="users" class="absolute left-4 top-3.5 w-4 h-4 text-gray-400"></i>
                        <input type="number" x-model="newRes.tamu" placeholder="0" class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm outline-none focus:bg-white focus:border-terralogBlue transition-all">
                    </div>
                </div>
            </div>

            <div class="flex gap-4">
                <div class="flex-1">
                    <label class="text-[10px] font-bold text-gray-400 uppercase mb-1.5 block tracking-wide">Jam Mulai</label>
                    <input type="time" x-model="newRes.jamMulai" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm outline-none focus:bg-white focus:border-terralogBlue transition-all">
                </div>
                <div class="flex-1">
                    <label class="text-[10px] font-bold text-gray-400 uppercase mb-1.5 block tracking-wide">Durasi (Menit)</label>
                    <input type="number" x-model="newRes.durasi" placeholder="90" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm outline-none focus:bg-white focus:border-terralogBlue transition-all">
                </div>
            </div>

            <div>
                <label class="text-[10px] font-bold text-gray-400 uppercase mb-1.5 block tracking-wide">Catatan Khusus (Opsional)</label>
                <textarea x-model="newRes.notes" placeholder="Misal: Request 1 kursi bayi, area dekat jendela, dll..." rows="2" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm outline-none focus:bg-white focus:border-terralogBlue transition-all resize-none"></textarea>
            </div>

            <div class="border-t border-gray-100 pt-3">
                <label class="text-[10px] font-bold text-gray-400 uppercase mb-2 block tracking-wide">Pilih Ruang Meja Sesuai Kapasitas</label>
                <div class="grid grid-cols-6 gap-2 max-h-[140px] overflow-y-auto p-2 border border-gray-100 bg-gray-50/50 rounded-xl custom-scrollbar">
                    <template x-for="t in availableTables" :key="t.id">
                        
                        <label class="flex flex-col items-center justify-center border rounded-xl py-2 px-1 cursor-pointer select-none transition-all duration-200 shadow-sm min-h-[58px]"
                               :class="newRes.table_ids.map(String).includes(String(t.id)) ? 'bg-terralogBlue text-white border-terralogBlue shadow-blue-100' : 'bg-white text-gray-700 border-gray-200 hover:bg-blue-50/50'">
                            
                            <input type="checkbox" :value="String(t.id)" x-model="newRes.table_ids" class="hidden">
                            
                            <span class="text-sm font-black leading-none" x-text="t.number"></span>
                            
                            <div class="flex items-center gap-1 mt-1.5 transition-colors duration-200"
                                 :class="newRes.table_ids.map(String).includes(String(t.id)) ? 'text-white/80' : 'text-gray-400'">
                                <i class="fa-solid fa-user text-[9px]"></i>
                                <span class="text-[11px] font-bold leading-none" x-text="t.capacity"></span>
                            </div>
                            
                        </label>
                    </template>
                </div>
            </div>

        </div>

        <div class="px-6 py-5 border-t border-gray-50 bg-gray-50/50 flex justify-end gap-3">
            <button @click="showAddModal = false" class="px-6 py-3 border border-gray-200 rounded-xl text-sm font-bold text-gray-500 hover:bg-gray-100 transition shadow-sm cursor-pointer">Batal</button>
            <button @click="saveReservation()" class="px-8 py-3 bg-terralogBlue text-white rounded-xl text-sm font-bold shadow-md hover:bg-blue-900 transition active:scale-95 cursor-pointer">Simpan Reservasi</button>
        </div>
    </div>
</div>
