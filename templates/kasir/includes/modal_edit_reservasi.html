<div x-show="showEditModal" class="fixed inset-0 z-[160] flex items-center justify-center" style="display: none;" x-cloak>
    <div x-transition:opacity class="absolute inset-0 bg-black/60 backdrop-blur-sm" @click="showEditModal = false"></div>
    <div x-transition:enter="transition ease-out duration-300 transform scale-95" 
         class="relative bg-white w-full max-w-[550px] mx-4 rounded-3xl shadow-2xl overflow-hidden text-left">
        
        <div class="px-6 py-5 bg-terralogBlue flex justify-between items-center">
            <div class="flex flex-col">
                <h2 class="text-lg font-bold text-white tracking-tight leading-tight">Detail Reservasi</h2>
                <div class="flex items-center gap-2 mt-1">
                    <span class="bg-white/20 text-white px-2 py-0.5 rounded text-[10px] font-black tracking-widest border border-white/10 uppercase" x-text="formRes.nomor_reservasi"></span>
                </div>
            </div>
            <button @click="showEditModal = false" class="text-white/60 hover:text-white transition-colors">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
        </div>

        <div class="p-6 space-y-4 bg-white max-h-[75vh] overflow-y-auto custom-scrollbar">
            
            <div class="flex gap-4">
                <div class="flex-[1.5]">
                    <label class="text-[10px] font-bold text-gray-400 uppercase mb-1.5 block tracking-wide flex items-center gap-1">
                        Nama Pelanggan 
                        <i x-show="formRes.is_mandiri" data-lucide="lock" class="w-3 h-3 text-terralogBlue" title="Terkunci (Akun Pelanggan)"></i>
                    </label>
                    <input type="text" x-model="formRes.nama" 
                           :disabled="['completed', 'cancelled'].includes(formRes.original_status) || formRes.is_mandiri" 
                           class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm outline-none focus:bg-white focus:border-terralogBlue transition-all disabled:opacity-70 disabled:cursor-not-allowed disabled:bg-gray-100">
                </div>
                
                <div class="flex-1">
                    <label class="text-[10px] font-bold text-gray-400 uppercase mb-1.5 block tracking-wide flex items-center gap-1">
                        Nomor Telepon
                        <i x-show="formRes.is_mandiri" data-lucide="lock" class="w-3 h-3 text-terralogBlue" title="Terkunci (Akun Pelanggan)"></i>
                    </label>
                    <input type="text" x-model="formRes.telepon" @input="formRes.telepon = formRes.telepon.replace(/[^0-9]/g, '');" 
                           :disabled="['completed', 'cancelled'].includes(formRes.original_status) || formRes.is_mandiri"
                           class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm outline-none focus:bg-white focus:border-terralogBlue transition-all disabled:opacity-70 disabled:cursor-not-allowed disabled:bg-gray-100">
                </div>
            </div>

            <div class="flex gap-4">
                <div class="flex-[1.5]">
                    <label class="text-[10px] font-bold text-gray-400 uppercase mb-1.5 block tracking-wide">Tanggal Kedatangan</label>
                    <input type="date" x-model="formRes.tanggal" 
                           :disabled="['completed', 'cancelled'].includes(formRes.original_status)"
                           class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm outline-none focus:bg-white focus:border-terralogBlue transition-all cursor-pointer disabled:opacity-70 disabled:cursor-not-allowed disabled:bg-gray-100">
                </div>
                <div class="flex-1">
                    <label class="text-[10px] font-bold text-gray-400 uppercase mb-1.5 block tracking-wide">Jumlah Tamu</label>
                    <div class="relative">
                        <i data-lucide="users" class="absolute left-4 top-3.5 w-4 h-4 text-gray-400"></i>
                        <input type="number" x-model="formRes.tamu" min="1"
                               :disabled="['completed', 'cancelled'].includes(formRes.original_status)"
                               class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm outline-none focus:bg-white focus:border-terralogBlue transition-all disabled:opacity-70 disabled:cursor-not-allowed disabled:bg-gray-100">
                    </div>
                </div>
            </div>

            <div class="flex gap-4">
                <div class="flex-1">
                    <label class="text-[10px] font-bold text-gray-400 uppercase mb-1.5 block tracking-wide">Jam Mulai</label>
                    <input type="time" x-model="formRes.jamMulai" 
                           :disabled="['completed', 'cancelled'].includes(formRes.original_status)"
                           class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm outline-none focus:bg-white focus:border-terralogBlue transition-all disabled:opacity-70 disabled:cursor-not-allowed disabled:bg-gray-100">
                </div>
                <div class="flex-1">
                    <label class="text-[10px] font-bold text-gray-400 uppercase mb-1.5 block tracking-wide">Durasi (Menit)</label>
                    <input type="number" x-model="formRes.durasi" min="0"
                           :disabled="['completed', 'cancelled'].includes(formRes.original_status)"
                           class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm outline-none focus:bg-white focus:border-terralogBlue transition-all disabled:opacity-70 disabled:cursor-not-allowed disabled:bg-gray-100">
                </div>
            </div>

            <div>
                <label class="text-[10px] font-bold text-gray-400 uppercase mb-1.5 block tracking-wide">Catatan Khusus (Opsional)</label>
                <textarea x-model="formRes.notes" rows="2" 
                          :disabled="['completed', 'cancelled'].includes(formRes.original_status)"
                          class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm outline-none focus:bg-white focus:border-terralogBlue transition-all resize-none disabled:opacity-70 disabled:cursor-not-allowed disabled:bg-gray-100"></textarea>
            </div>

            <div class="border-t border-gray-100 pt-3">
                <label class="text-[10px] font-bold text-gray-400 uppercase mb-2 block tracking-wide">Pilih Ruang Meja Sesuai Kapasitas</label>
                <div class="grid grid-cols-6 gap-2 max-h-[140px] overflow-y-auto p-2 border border-gray-100 bg-gray-50/50 rounded-xl custom-scrollbar"
                     :class="{'pointer-events-none opacity-70': ['completed', 'cancelled'].includes(formRes.original_status)}">
                    <template x-for="t in availableTables" :key="t.id">
                        <label class="flex flex-col items-center justify-center border rounded-xl py-2 px-1 cursor-pointer select-none transition-all duration-200 shadow-sm min-h-[58px]"
                               :class="formRes.table_ids.map(String).includes(String(t.id)) ? 'bg-terralogBlue text-white border-terralogBlue shadow-blue-100' : 'bg-white text-gray-700 border-gray-200 hover:bg-blue-50/50'">
                            <input type="checkbox" :value="String(t.id)" x-model="formRes.table_ids" class="hidden">
                            <span class="text-sm font-black leading-none" x-text="t.number"></span>
                            <div class="flex items-center gap-1 mt-1.5 transition-colors duration-200"
                                 :class="formRes.table_ids.map(String).includes(String(t.id)) ? 'text-white/80' : 'text-gray-400'">
                                <i class="fa-solid fa-user text-[9px]"></i>
                                <span class="text-[11px] font-bold leading-none" x-text="t.capacity"></span>
                            </div>
                        </label>
                    </template>
                </div>
            </div>

            <div class="border-t border-gray-100 pt-4">
                <label class="text-[10px] font-bold text-gray-400 uppercase block mb-2 tracking-wide">Status & Aksi Reservasi</label>
                
                <div class="flex items-center justify-between bg-gray-50 border border-gray-100 rounded-2xl p-3 mb-3.5">
                    <span class="text-xs font-bold text-gray-500">Status Reservasi Saat Ini:</span>
                    <span class="px-3 py-1.5 rounded-lg text-white text-[10px] font-black uppercase tracking-wider shadow-sm"
                          :class="{
                              'bg-[#FF8A48]': formRes.original_status === 'pending', 
                              'bg-emerald-500': formRes.original_status === 'confirmed', 
                              'bg-red-500': formRes.original_status === 'cancelled', 
                              'bg-blue-500': formRes.original_status === 'completed'
                          }"
                          x-text="statusDisplay[formRes.original_status] || formRes.original_status"></span>
                </div>

                <div x-show="formRes.original_status === 'pending'" class="space-y-2">
                    <div class="flex gap-2.5">
                        <button type="button" @click="formRes.status = 'confirmed'"
                                :class="formRes.status === 'confirmed' ? 'bg-emerald-600 text-white shadow-md border-emerald-600' : 'bg-white text-emerald-600 border border-emerald-200 hover:bg-emerald-50'"
                                class="flex-1 py-3 rounded-xl text-xs font-black uppercase tracking-wider transition-all flex items-center justify-center gap-2 cursor-pointer focus:outline-none">
                            <i data-lucide="check-circle" class="w-4 h-4"></i> Terima & Konfirmasi
                        </button>
                        
                        <button type="button" @click="formRes.status = 'cancelled'"
                                :class="formRes.status === 'cancelled' ? 'bg-red-600 text-white shadow-md border-red-600' : 'bg-white text-red-500 border border-red-200 hover:bg-red-50'"
                                class="flex-1 py-3 rounded-xl text-xs font-black uppercase tracking-wider transition-all flex items-center justify-center gap-2 cursor-pointer focus:outline-none">
                            <i data-lucide="x-circle" class="w-4 h-4"></i> Tolak / Batalkan
                        </button>
                    </div>
                    
                    <div x-show="formRes.status === 'confirmed'" class="text-[10px] text-emerald-600 font-bold italic mt-1 text-right cursor-pointer hover:underline" @click="formRes.status = 'pending'">
                        ✕ Batalkan pilihan konfirmasi (Kembali ke Awal)
                    </div>
                </div>

                <div x-show="formRes.original_status === 'confirmed'" class="space-y-2">
                    <div class="flex flex-col gap-2">
                        <button type="button" @click="window.location.href = '/kasir/dashboard?checkin=' + formRes.id"
                                class="w-full py-3 bg-emerald-600 text-white rounded-xl text-xs font-black uppercase tracking-wider shadow-md hover:bg-emerald-700 transition active:scale-95 flex items-center justify-center gap-2 cursor-pointer focus:outline-none">
                            <i data-lucide="rocket" class="w-4 h-4 stroke-[3]"></i> Check-In & Buka Order POS
                        </button>
                        
                        <button type="button" @click="formRes.status = (formRes.status === 'cancelled' ? 'confirmed' : 'cancelled')"
                                :class="formRes.status === 'cancelled' ? 'bg-red-600 text-white shadow-md border-red-600' : 'bg-white text-red-500 border border-red-200 hover:bg-red-50'"
                                class="w-full py-3 rounded-xl text-xs font-black uppercase tracking-wider transition-all flex items-center justify-center gap-2 cursor-pointer focus:outline-none">
                            <i data-lucide="alert-triangle" class="w-4 h-4"></i>
                            <span x-text="formRes.status === 'cancelled' ? 'Kembali ke Terkonfirmasi' : 'Batalkan Reservasi'"></span>
                        </button>
                    </div>
                </div>

                <div x-show="formRes.original_status === 'completed'" class="bg-blue-50 border border-blue-100 rounded-2xl p-4 flex gap-3 items-start">
                    <i data-lucide="info" class="w-5 h-5 text-blue-500 shrink-0 mt-0.5"></i>
                    <div>
                        <h4 class="text-xs font-bold text-blue-900">Siklus Reservasi Selesai</h4>
                        <p class="text-[11px] text-blue-700 font-medium mt-0.5 leading-relaxed">Pelanggan ini telah sukses melakukan Check-In di meja kafe dan menyelesaikan seluruh transaksi pesanan riil melalui POS kasir.</p>
                    </div>
                </div>

                <div x-show="formRes.original_status === 'cancelled'" class="bg-red-50 border border-red-100 rounded-2xl p-4 flex gap-3 items-start">
                    <i data-lucide="alert-circle" class="w-5 h-5 text-red-500 shrink-0 mt-0.5"></i>
                    <div class="w-full">
                        <h4 class="text-xs font-bold text-red-900">Reservasi Telah Hangus / Gugur</h4>
                        <p class="text-[10px] text-red-400 font-bold mt-2 uppercase tracking-wider">Alasan Pembatalan:</p>
                        <p class="text-xs font-medium text-red-900 italic mt-0.5" x-text="formRes.alasan_batal || 'Tidak ada alasan spesifik yang dicatat oleh kasir.'"></p>
                    </div>
                </div>

                <div x-show="formRes.status === 'cancelled' && formRes.original_status !== 'cancelled'" 
                     x-transition:enter="transition ease-out duration-300 transform"
                     x-transition:enter-start="opacity-0 -translate-y-4"
                     x-transition:enter-end="opacity-100 translate-y-0"
                     class="mt-4">
                    <label class="text-[10px] font-bold text-red-400 uppercase mb-1.5 block tracking-wide flex items-center gap-1">
                        <i data-lucide="alert-circle" class="w-3 h-3"></i> Berikan Alasan Pembatalan Wajib
                    </label>
                    <textarea x-model="formRes.alasan_batal" rows="2" placeholder="Contoh: Pelanggan mendadak sakit / No-Show tanpa ada kabar via WA setelah 30 menit..." 
                              class="w-full px-4 py-3 bg-red-50/50 border border-red-200 rounded-xl text-sm font-medium text-red-900 placeholder-red-300 outline-none focus:bg-white focus:border-red-400 transition-all resize-none"></textarea>
                </div>
            </div>
        </div>

        <div class="px-6 py-5 border-t border-gray-50 bg-gray-50/50 flex justify-end gap-3">
            <button @click="showEditModal = false" class="px-6 py-3 border border-gray-200 rounded-xl text-sm font-bold text-gray-500 hover:bg-gray-100 transition shadow-sm cursor-pointer" x-text="['completed', 'cancelled'].includes(formRes.original_status) ? 'Tutup' : 'Batal'"></button>
            
            <button x-show="!['completed', 'cancelled'].includes(formRes.original_status)" @click="updateRes()" class="px-8 py-3 bg-terralogBlue text-white rounded-xl text-sm font-bold shadow-md hover:bg-blue-900 transition active:scale-95 cursor-pointer">Simpan Perubahan</button>
        </div>
    </div>
</div>
