{% extends 'layout.html' %}

{% block title %}Pesanan Aktif - Terralog{% endblock %}

{% block content %}
<div class="customer-page-shell flex-1 p-8 bg-[#F5F7FF]" x-data="pesananAktifApp()" @load="$watch('items', () => lucide.createIcons())" x-cloak>
    <div class="max-w-7xl mx-auto">
        
        <div class="mb-8">
            <div class="flex items-center gap-2 text-3xl font-bold leading-tight flex-wrap mb-2">
                <a href="/customer/pesanan-saya" class="text-gray-400 hover:text-terralogBlue transition">Pesanan Saya</a>
                <span class="text-gray-400">›</span>
                <span class="text-terralogBlue">Pesanan Aktif</span>
            </div>
            <p class="text-gray-500 font-medium text-sm">Pantau status pesanan aktif Anda</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 items-start">
            
            <div class="lg:col-span-2 space-y-6">
                <template x-if="order.payment_status === 'unpaid'">
                    <div class="bg-blue-50 border border-blue-200 rounded-[24px] p-6 shadow-sm flex items-start gap-4">
                        <div class="bg-white p-2.5 rounded-full shadow-sm shrink-0">
                            <i data-lucide="info" class="w-6 h-6 text-terralogBlue"></i>
                        </div>
                        <div>
                            <h4 class="font-bold text-slate-800 text-lg mb-2">Langkah Selanjutnya</h4>
                            <template x-if="paymentMethod === 'qris'">
                                <p class="text-sm text-slate-600 leading-relaxed font-medium">
                                    Pesanan Anda telah kami terima. Silakan datang ke meja kasir dan tunjukkan bukti transfer QRIS Anda untuk <strong>mengonfirmasi pembayaran</strong> agar pesanan dapat segera disiapkan oleh koki.
                                </p>
                            </template>
                            <template x-if="paymentMethod !== 'qris'">
                                <p class="text-sm text-slate-600 leading-relaxed font-medium">
                                    Pesanan Anda telah kami terima. Silakan datang ke meja kasir untuk <strong>menyelesaikan pembayaran</strong> secara tunai agar pesanan dapat segera disiapkan oleh koki.
                                </p>
                            </template>
                        </div>
                    </div>
                </template>

                <template x-if="order.payment_status === 'paid'">
                    <div class="flex items-start justify-between relative px-2 md:px-12 mt-4 mb-4">
                        <div class="absolute top-7 left-14 right-14 md:left-24 md:right-24 h-1 flex z-0">
                            <div class="h-full w-1/2 transition-colors duration-500" 
                                    :class="['ready', 'served'].includes(order.order_status) ? 'bg-green-600' : 'bg-gray-200'"></div>
                            <div class="h-full w-1/2 transition-colors duration-500" 
                                    :class="order.order_status === 'served' ? 'bg-green-500' : 'bg-gray-200'"></div>
                        </div>

                        <div class="flex flex-col items-center gap-3 z-10 w-24">
                            <div class="w-14 h-14 rounded-full flex items-center justify-center shadow-md transition-colors duration-500"
                                    :class="['ready', 'served'].includes(order.order_status) ? 'bg-green-600 text-white' : 
                                        (order.order_status === 'preparing' ? 'bg-yellow-400 text-white' : 'bg-gray-200 text-gray-500')">
                                <i data-lucide="chef-hat" class="w-6 h-6"></i>
                            </div>
                            <span class="text-xs font-bold uppercase tracking-wider text-center" 
                                    :class="['ready', 'served'].includes(order.order_status) ? 'text-green-600' : 
                                            (order.order_status === 'preparing' ? 'text-yellow-600' : 'text-gray-400')">Sedang Dibuat</span>
                        </div>

                        <div class="flex flex-col items-center gap-3 z-10 w-24">
                            <div class="w-14 h-14 rounded-full flex items-center justify-center shadow-md transition-colors duration-500"
                                    :class="order.order_status === 'served' ? 'bg-green-600 text-white' : 
                                        (order.order_status === 'ready' ? 'bg-yellow-400 text-white' : 'bg-gray-200 text-gray-500')">
                                <i data-lucide="concierge-bell" class="w-6 h-6"></i>
                            </div>
                            <span class="text-xs font-bold uppercase tracking-wider text-center" 
                                    :class="order.order_status === 'served' ? 'text-green-600' : 
                                            (order.order_status === 'ready' ? 'text-yellow-600' : 'text-gray-400')">Siap Diantar</span>
                        </div>

                        <div class="flex flex-col items-center gap-3 z-10 w-24">
                            <div class="w-14 h-14 rounded-full flex items-center justify-center shadow-md transition-colors duration-500"
                                    :class="order.order_status === 'served' ? 'bg-green-600 text-white' : 'bg-gray-200 text-gray-500'">
                                <i data-lucide="check" class="w-6 h-6"></i>
                            </div>
                            <span class="text-xs font-bold uppercase tracking-wider text-center" 
                                    :class="order.order_status === 'served' ? 'text-green-600' : 'text-gray-400'">Disajikan</span>
                        </div>
                    </div>
                </template>
                
                <div class="bg-white rounded-[24px] shadow-sm border border-gray-100 p-6">
                    <h2 class="text-lg font-bold text-slate-800 mb-5 flex items-center gap-2">
                        <i data-lucide="user" class="w-5 h-5 text-terralogBlue"></i> Informasi Pesanan
                    </h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-6 bg-slate-50 p-5 rounded-2xl border border-slate-100">
                        <div>
                            <label class="text-slate-500 text-[10px] font-bold uppercase tracking-wider block mb-1">Nama Pemesan</label>
                            <p class="text-slate-800 text-base font-bold" x-text="order.customer_name || '{{ current_user.name }}'"></p>
                        </div>
                        <div>
                            <label class="text-slate-500 text-[10px] font-bold uppercase tracking-wider block mb-1">No. Pesanan</label>
                            <p class="text-slate-800 text-base font-bold" x-text="order.order_number || '-'"></p>
                        </div>
                        <div>
                            <label class="text-slate-500 text-[10px] font-bold uppercase tracking-wider block mb-1">Tipe Pesanan</label>
                            <p class="text-slate-800 text-base font-bold" x-text="order.order_type === 'dine_in' ? 'Dine In' : 'Take Away'"></p>
                        </div>
                        <div>
                            <label class="text-slate-500 text-[10px] font-bold uppercase tracking-wider block mb-1">Nomor Meja</label>
                            <p class="text-slate-800 text-base font-bold" x-text="order.no_meja || '-'"></p>
                        </div>
                        <div>
                            <label class="text-slate-500 text-[10px] font-bold uppercase tracking-wider block mb-1">Metode Bayar</label>
                            <p class="text-slate-800 text-base font-bold" x-text="paymentMethod === 'qris' ? 'QRIS' : (paymentMethod === 'cash' ? 'Tunai' : 'Non Tunai')"></p>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-[24px] shadow-sm border border-gray-100 p-6">
                    <div class="flex justify-between items-end mb-5">
                        <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                            <i data-lucide="shopping-bag" class="w-5 h-5 text-terralogBlue"></i> Daftar Menu
                        </h2>
                        <span class="text-sm font-bold text-terralogBlue bg-blue-50 px-3 py-1 rounded-full" x-text="`${items.length} Item`"></span>
                    </div>

                    <div class="space-y-4">
                        <template x-for="(item, index) in items" :key="index">
                            <div class="rounded-2xl p-4 border transition-all flex gap-4 items-start bg-white border-slate-100 shadow-sm">
                                <div class="w-16 h-16 rounded-xl overflow-hidden bg-slate-100 flex-shrink-0 border border-slate-200">
                                    <template x-if="item.img">
                                        <img :src="item.img" :alt="item.nama" class="w-full h-full object-cover">
                                    </template>
                                    <template x-if="!item.img">
                                        <div class="w-full h-full flex items-center justify-center bg-gray-200 text-gray-400">
                                            <i data-lucide="image" class="w-6 h-6"></i>
                                        </div>
                                    </template>
                                </div>

                                <div class="flex-1">
                                    <div class="flex items-start justify-between mb-1">
                                        <div>
                                            <h4 class="font-bold text-slate-900 text-base" x-text="item.nama"></h4>
                                            <p class="font-bold text-terralogBlue text-sm" x-text="`Rp ${item.harga.toLocaleString('id-ID')}`"></p>
                                        </div>
                                        <span class="bg-slate-100 text-slate-700 font-bold px-3 py-1 rounded-lg text-sm" x-text="`${item.qty}x`"></span>
                                    </div>
                                    <div x-show="item.note" class="mt-2 bg-slate-50 rounded-lg p-2.5 border border-slate-100 flex items-start gap-2">
                                        <i data-lucide="message-square" class="w-3.5 h-3.5 text-slate-400 mt-0.5 shrink-0"></i>
                                        <p class="text-slate-600 text-xs font-medium" x-text="item.note"></p>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-1">
                <div class="bg-white rounded-[24px] shadow-lg border border-slate-100 p-6 sticky top-28">
                    
                    <h3 class="text-sm font-bold text-slate-900 mb-4 uppercase tracking-wider">Ringkasan Pembayaran</h3>
                    
                    <div class="space-y-4 mb-6">
                        <template x-for="(item, index) in items" :key="index">
                            <div class="flex justify-between text-sm text-slate-600 font-medium">
                                <span class="line-clamp-1 pr-4" x-text="`${item.qty}x ${item.nama}`"></span>
                                <span class="shrink-0" x-text="`Rp ${(item.qty * item.harga).toLocaleString('id-ID')}`"></span>
                            </div>
                        </template>
                    </div>

                    <div class="border-t border-slate-100 pt-4 mb-6">
                        <div class="flex justify-between items-end">
                            <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">Total Akhir</span>
                            <span class="text-2xl font-bold text-terralogBlue" x-text="`Rp ${total.toLocaleString('id-ID')}`"></span>
                        </div>
                    </div>

                    <button :disabled="order.order_status !== 'served'"
                            class="w-full py-4 rounded-xl font-bold text-sm transition-all flex justify-center items-center gap-2 shadow-sm mb-3"
                            :class="order.order_status === 'served' ? 'bg-terralogBlue hover:bg-blue-500 text-white cursor-pointer' : 'bg-gray-200 text-gray-400 cursor-not-allowed'">
                        <i data-lucide="star" class="w-4 h-4"></i>
                        Beri Ulasan
                    </button>

                    <a href="/customer/pesanan-saya" class="w-full py-4 rounded-xl text-slate-700 bg-slate-100 hover:bg-slate-200 font-bold text-sm transition-all flex justify-center items-center gap-2 shadow-sm active:scale-95">
                        <i data-lucide="arrow-left" class="w-4 h-4"></i>
                        Kembali ke Daftar Pesanan
                    </a>
                </div>
            </div>

        </div>
    </div>
</div>

<style>
    [x-cloak] { display: none !important; }
</style>

<script>
    function pesananAktifApp() {
        // PERBAIKAN: Menggunakan parsing yang aman untuk mencegah error JSON
        let serverData = null;
        try {
            const rawData = '{{ order_json|tojson if order_json else "{}"|safe }}';
            serverData = JSON.parse(rawData);
        } catch(e) {
            console.error("Gagal memuat data:", e);
            serverData = {};
        }
        
        let items = serverData.items || [];
        // PERBAIKAN: Backend menggunakan 'cash' bukan 'tunai'
        let paymentMethod = serverData.payment_method || 'cash';
        let total = serverData.total_amount || 0;
        
        return {
            items: items,
            paymentMethod: paymentMethod,
            total: total,
            order: serverData,
            
            init() {
                if (typeof lucide !== 'undefined') {
                    lucide.createIcons();
                }
            }
        }
    }
</script>
{% endblock %}
